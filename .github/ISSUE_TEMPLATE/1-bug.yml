name: Something doesn't work
description: A bug in HMG-API, or in a mod you're not sure about (the wireless mod has its own repo).
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't post your VIN, serial numbers, phone numbers or account details: nothing here needs them.
        A **Car Report** (HMG-API app → Car Report) helps a lot: attach its `.json` file, from the USB stick (folder "HMG-API reports") or over adb (`adb pull /data/hmgapi/public/reports/`).
  - type: input
    id: car
    attributes:
      label: Car
      description: Make, model, year, trim and region.
    validations:
      required: true
  - type: dropdown
    id: supported
    attributes:
      label: Is your car supported?
      description: See [Supported cars](https://github.com/Open-HMG/HMG-API/wiki/Supported-cars). Only each region's newest head unit software is supported; on older software, updating often fixes it.
      options:
        - Listed, with the software version shown there
        - Listed, but my head unit has older software
        - Not listed (or I don't know)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Head unit software
      description: From the Car Report, or Settings → General → Software info (e.g. 260507).
  - type: dropdown
    id: install
    attributes:
      label: How you installed HMG-API
      options:
        - USB stick (Engineering Mode → DSP → Update OTA)
        - NEMESIS
        - adb
  - type: input
    id: version
    attributes:
      label: HMG-API version and mods
      description: Shown at the top of the HMG-API app, and the mods you have on (with their versions; say if you used "Install anyway" for one that doesn't list your car).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: HMG-API app → Logs → "Warnings and errors" (a photo is fine), or attach a Car Report.
      render: text
