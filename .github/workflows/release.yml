# A HMG-API release from a version tag (v1.0.0, v1.0.0-beta.1): built and tested,
# with the mod SDK (hmgapi-mod-sdk-<version>.zip, in SHA256SUMS: what mod repos pin),
# signed with HMG-API's keys (repository secrets), then attached to a *draft* GitHub
# release (a pre-release when the tag has a "-"). Publishing it stays a person's call.
#
# Secrets (in the "release" environment, which only v* tags can use): HMGAPI_APP_P12 (base64) and HMGAPI_APP_PASS, the app's signing key;
# HMGAPI_RELEASE_KEY and HMGAPI_RELEASE_KEY_PUB (base64), the release key the app
# checks updates against. The bundled mods come signed from their own repos' releases
# (tools/release-mods.txt, pinned by their catalogue entries); core signs no mod.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # gh gets its token explicitly, below

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld qemu-user-static binfmt-support zip unzip mksh
          pip install --require-hashes -r tools/requirements.txt

      - name: The tag is this version
        run: |
          v=$(sed -n 's/.*HMGAPI_VERSION = "\(.*\)";/\1/p' core/runtime/java/hmgapi/engine/Engine.java)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but HMG-API's version is $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Keys
        env:
          APP_P12: ${{ secrets.HMGAPI_APP_P12 }}
          APP_PASS: ${{ secrets.HMGAPI_APP_PASS }}
          RELEASE_KEY: ${{ secrets.HMGAPI_RELEASE_KEY }}
          RELEASE_KEY_PUB: ${{ secrets.HMGAPI_RELEASE_KEY_PUB }}
        run: |
          umask 077
          k="$RUNNER_TEMP/keys"
          mkdir -p "$k"
          echo "$APP_P12" | base64 -d > "$k/app.p12"
          printf '%s\n' "$APP_PASS" > "$k/app.pass"
          echo "$RELEASE_KEY" | base64 -d > "$k/release.key"
          echo "$RELEASE_KEY_PUB" | base64 -d > "$k/release.key.pub"
          for f in app.p12 app.pass release.key release.key.pub; do test -s "$k/$f" || { echo "secret for $f is missing"; exit 1; }; done
          echo "HMGAPI_KEY=$k/app.p12" >> "$GITHUB_ENV"
          echo "HMGAPI_RELEASE_KEY=$k/release.key" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          ./build.sh
          ./build.sh sdk   # the mod SDK, for mod repos (docs/mod-repos.md section 3)
          tools/test-all.sh

      - name: Mods, release and downloads
        run: |
          rm -rf out/packages
          # the bundled mods: each catalogue entry's download, SHA-256 and signature checked
          tools/catalog.py fetch out/packages $(grep -v '^#' tools/release-mods.txt)
          tools/mkinstallers.sh   # also each mod as a NEMESIS package, in out/dist/mods
          mkdir -p out/assets
          cp out/dist/hmgapi-"$VERSION"-*.zip out/assets/
          cp out/dist/hmgapi-mod-sdk-"$VERSION".zip out/assets/
          cp out/releases/hmgapi-"$VERSION".zip out/assets/hmgapi-"$VERSION"-update.zip
          cp out/packages/*.zip out/assets/
          cp out/dist/mods/*-nemesis*.zip out/assets/
          (cd out/assets && sha256sum *.zip > SHA256SUMS)

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=CHANGELOG.md
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --title "HMG-API $VERSION" --notes-file "$notes" out/assets/*

      - name: Forget the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
